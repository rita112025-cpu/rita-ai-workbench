[project]
name = "rita-agent-reach"
version = "0.1.0"
description = "Capability-discovery adapter around the Agent Reach CLI for research acquisition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# No runtime dependencies on purpose: this package orchestrates external CLIs
# (agent-reach, gh, yt-dlp) and uses the standard library for the one plain
# HTTP path. Unit tests therefore run offline with nothing installed but pytest.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
]

[project.scripts]
rita-agent-reach = "rita_agent_reach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rita_agent_reach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit third-party sites and are opt-in only, so CI never goes
# red because YouTube or Jina Reader had a bad afternoon.
addopts = "-m 'not integration'"
markers = [
    "integration: hits the live network or a real external CLI (opt-in: -m integration)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.ruff.lint.isort]
known-first-party = ["rita_agent_reach"]
