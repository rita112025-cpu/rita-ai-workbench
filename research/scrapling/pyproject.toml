[project]
name = "rita-scrapling-collector"
version = "0.1.0"
description = "Public web collector for research acquisition, built on Scrapling's parser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Scrapling core only -- the parser and its adaptive element storage. The
# `fetchers` extra is deliberately NOT declared: in 0.4.15 it pulls in
# patchright, which this project does not install or integrate. See README.
dependencies = [
    "scrapling>=0.4.15,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
]

[project.scripts]
rita-scrapling = "rita_scrapling.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rita_scrapling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-network tests are opt-in so CI never depends on a third-party site.
addopts = "-m 'not integration'"
markers = [
    "integration: hits the live network (opt-in: -m integration)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["rita_scrapling"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["scrapling.*"]
ignore_missing_imports = true
